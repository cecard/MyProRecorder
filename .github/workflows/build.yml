name: Build All-in-One Recorder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies (Force Install)
      run: |
        python -m pip install --upgrade pip
        pip install pyaudiowpatch screeninfo numpy pillow pystray pyinstaller

    - name: Generate App Icon (On-the-fly)
      run: |
        # 创建一个临时脚本来生成 .ico 图标文件
        # 这样你就不用自己上传图标了，且保证和程序里的图标一模一样
        python -c "
        from PIL import Image, ImageDraw
        size = 256
        image = Image.new('RGBA', (size, size), (0, 0, 0, 0))
        draw = ImageDraw.Draw(image)
        # 画个大眼睛
        draw.ellipse((10, 10, 246, 246), fill=(240, 240, 240), outline=(200, 200, 200))
        draw.ellipse((70, 70, 186, 186), fill=(0, 120, 212))
        draw.ellipse((108, 108, 148, 148), fill=(20, 20, 20))
        draw.ellipse((153, 76, 178, 101), fill=(255, 255, 255, 230))
        image.save('app_icon.ico', format='ICO', sizes=[(256, 256)])
        print('Icon generated successfully!')
        "

    - name: Download FFmpeg (Static Build)
      shell: pwsh
      run: |
        Write-Host "Downloading FFmpeg..."
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip" -UserAgent "NativeHost"
        Write-Host "Extracting FFmpeg..."
        Expand-Archive ffmpeg.zip -DestinationPath .
        Write-Host "Moving ffmpeg.exe..."
        $ffmpegPath = Get-ChildItem -Path . -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Move-Item $ffmpegPath.FullName .\ffmpeg.exe

    - name: Build EXE
      run: |
        # 关键修改：添加了 --icon="app_icon.ico"
        pyinstaller --noconfirm --onefile --windowed --name "ProScreenRecorder" --icon="app_icon.ico" --add-binary "ffmpeg.exe;." --hidden-import "pyaudiowpatch" --hidden-import "pystray" --hidden-import "PIL" recorder_pro.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProScreenRecorder-EXE
        path: dist/ProScreenRecorder.exe
        compression-level: 0
