name: Build Pro Recorder (Native Libs)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装 mss (截屏) 和 opencv (编码), numpy (数据处理)
        pip install mss opencv-python numpy pillow pystray pyaudiowpatch pyinstaller

    - name: Generate Icon
      shell: python
      run: |
        from PIL import Image, ImageDraw
        def create_eye_icon(size):
            img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
            draw = ImageDraw.Draw(img)
            draw.ellipse((0, 0, size, size), fill=(240, 240, 240))
            c = size / 2
            draw.ellipse((c-size*0.3, c-size*0.3, c+size*0.3, c+size*0.3), fill=(30, 144, 255))
            draw.ellipse((c-size*0.15, c-size*0.15, c+size*0.15, c+size*0.15), fill=(20, 20, 20))
            return img
        img = create_eye_icon(256)
        img.save("app_icon.ico", format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (32, 32)])

    - name: Build EXE
      run: |
        # 注意：不再需要 add-binary ffmpeg，因为我们改用 opencv 了
        pyinstaller --clean --noconfirm --onefile --windowed --name "ProRecorder" --icon="app_icon.ico" --add-data "app_icon.ico;." --hidden-import "mss" --hidden-import "cv2" --hidden-import "numpy" recorder_pro.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProRecorder-Native
        path: dist/ProRecorder.exe
