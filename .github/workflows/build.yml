name: Build All-in-One Recorder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装绘图和打包所需的库
        pip install pyaudiowpatch screeninfo numpy pillow pystray pyinstaller

    - name: Generate High-Res Icon (Local)
      shell: python
      run: |
        from PIL import Image, ImageDraw
        
        # 1. 创建一个 256x256 的高清画布 (RGBA透明)
        img = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
        draw = ImageDraw.Draw(img)
        
        # 2. 绘制 "录制风格" 的图标
        # 外圈 (白色背景)
        draw.ellipse((10, 10, 246, 246), fill=(245, 245, 245), outline=(200, 200, 200), width=2)
        # 中圈 (深灰色装饰)
        draw.ellipse((40, 40, 216, 216), outline=(220, 220, 220), width=5)
        # 内圈 (鲜艳的红色录制点)
        draw.ellipse((60, 60, 196, 196), fill=(234, 51, 35))
        # 高光 (增加立体感)
        draw.ellipse((140, 70, 180, 110), fill=(255, 255, 255, 100))
        
        # 3. 生成包含所有标准尺寸的 ICO 文件
        # 这确保了在 Windows 资源管理器的大图标、小图标、列表视图里都清晰
        sizes = [(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)]
        img.save('app_icon.ico', format='ICO', sizes=sizes)
        print("Icon generated successfully!")

    - name: Download FFmpeg (Static Build)
      shell: pwsh
      run: |
        Write-Host "Downloading FFmpeg..."
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip" -UserAgent "NativeHost"
        Write-Host "Extracting FFmpeg..."
        Expand-Archive ffmpeg.zip -DestinationPath .
        Write-Host "Moving ffmpeg.exe..."
        $ffmpegPath = Get-ChildItem -Path . -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Move-Item $ffmpegPath.FullName .\ffmpeg.exe

    - name: Build EXE
      run: |
        # --clean 清理缓存
        # --noconsole 隐藏黑框
        # --icon 指定刚才生成的图标
        pyinstaller --clean --noconfirm --onefile --windowed --name "ProRecorder" --icon="app_icon.ico" --add-binary "ffmpeg.exe;." --hidden-import "pyaudiowpatch" --hidden-import "pystray" --hidden-import "PIL" recorder_pro.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProRecorder-EXE
        path: dist/ProRecorder.exe
        compression-level: 0
