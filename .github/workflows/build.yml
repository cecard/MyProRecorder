name: Build All-in-One Recorder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyaudiowpatch screeninfo numpy pillow pystray pyinstaller

    - name: Generate High-Res Icon (PIL Method)
      shell: python
      run: |
        from PIL import Image, ImageDraw
        # 生成一个包含所有标准尺寸的 ICO，确保 Windows 能识别
        img = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
        draw = ImageDraw.Draw(img)
        # 白底
        draw.ellipse((10, 10, 246, 246), fill=(255, 255, 255), outline=(200, 200, 200), width=2)
        # 红点 (录制标志)
        draw.ellipse((50, 50, 206, 206), fill=(234, 51, 35))
        # 保存
        img.save('app_icon.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])

    - name: Download FFmpeg (Static Build)
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip" -UserAgent "NativeHost"
        Expand-Archive ffmpeg.zip -DestinationPath .
        $ffmpegPath = Get-ChildItem -Path . -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Move-Item $ffmpegPath.FullName .\ffmpeg.exe

    - name: Build EXE
      run: |
        # --clean 清除缓存，防止图标不更新
        # --add-data 强制打包图标
        pyinstaller --clean --noconfirm --onefile --windowed --name "ProRecorder" --icon="app_icon.ico" --add-data "app_icon.ico;." --add-binary "ffmpeg.exe;." --hidden-import "pyaudiowpatch" --hidden-import "pystray" --hidden-import "PIL" recorder_pro.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProRecorder-EXE
        path: dist/ProRecorder.exe
        compression-level: 0
