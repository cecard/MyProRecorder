name: Build All-in-One Recorder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 移除 pywin32，回归纯净稳定版
        pip install pyaudiowpatch screeninfo numpy pillow pystray pyinstaller

    - name: Download Professional Icon
      shell: pwsh
      run: |
        # 直接下载一个现成的、格式标准的 ICO 文件
        # 这是一个红色的录制按钮风格图标，非常适合录屏软件
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/microsoft/fluentui-system-icons/master/assets/Record/ic_fluent_record_24_regular.svg" -OutFile "icon.svg"
        # 由于直接下载ico可能不稳定，我们还是用Python转一下确保万无一失，但这次源是标准的
        python -c "
        from PIL import Image, ImageDraw
        # 画一个简单粗暴的高清图标，确保格式绝对标准
        img = Image.new('RGBA', (256, 256), (0,0,0,0))
        draw = ImageDraw.Draw(img)
        # 外部白圈
        draw.ellipse((10,10,246,246), fill=(255,255,255))
        # 内部红点
        draw.ellipse((40,40,216,216), fill=(234, 51, 35))
        # 保存
        img.save('app_icon.ico', format='ICO', sizes=[(256,256), (128,128), (64,64), (48,48), (32,32), (16,16)])
        "

    - name: Download FFmpeg (Static Build)
      shell: pwsh
      run: |
        Write-Host "Downloading FFmpeg..."
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip" -UserAgent "NativeHost"
        Write-Host "Extracting FFmpeg..."
        Expand-Archive ffmpeg.zip -DestinationPath .
        Write-Host "Moving ffmpeg.exe..."
        $ffmpegPath = Get-ChildItem -Path . -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Move-Item $ffmpegPath.FullName .\ffmpeg.exe

    - name: Build EXE
      run: |
        # --clean 清理缓存
        # --noconsole 确保没有黑框
        pyinstaller --clean --noconfirm --onefile --windowed --name "ProRecorder" --icon="app_icon.ico" --add-binary "ffmpeg.exe;." --hidden-import "pyaudiowpatch" --hidden-import "pystray" --hidden-import "PIL" recorder_pro.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProRecorder-EXE
        path: dist/ProRecorder.exe
        compression-level: 0
