name: Build All-in-One Recorder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
        pip install pyinstaller

    - name: Download FFmpeg (Static Build)
      shell: pwsh
      run: |
        Write-Host "Downloading FFmpeg..."
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
        Write-Host "Extracting FFmpeg..."
        Expand-Archive ffmpeg.zip -DestinationPath .
        Write-Host "Moving ffmpeg.exe..."
        # 寻找解压后文件夹中的 ffmpeg.exe 并移动到当前目录
        $ffmpegPath = Get-ChildItem -Path . -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Move-Item $ffmpegPath.FullName .\ffmpeg.exe

    - name: Build EXE (Bundled FFmpeg)
      run: |
        # 这里的 --add-binary "ffmpeg.exe;." 就是把ffmpeg塞进程序内部的关键指令
        pyinstaller --noconfirm --onefile --windowed --name "ProScreenRecorder" --add-binary "ffmpeg.exe;." recorder_pro.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: ProScreenRecorder-EXE
        path: dist/ProScreenRecorder.exe
