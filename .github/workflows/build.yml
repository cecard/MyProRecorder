name: Build All-in-One Recorder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyaudiowpatch screeninfo numpy pillow pystray pyinstaller

    - name: Generate Professional Icon
      run: |
        python -c "
        from PIL import Image, ImageDraw
        
        def create_img(size):
            img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
            draw = ImageDraw.Draw(img)
            # 绘制更加饱满的图标，确保在属性里清晰可见
            bg_color = (255, 255, 255) # 白色底板，兼容性更好
            draw.ellipse((0, 0, size, size), fill=bg_color) 
            
            # 蓝眼球
            margin = size * 0.1
            draw.ellipse((margin, margin, size-margin, size-margin), fill=(0, 120, 212))
            
            # 瞳孔
            p_r = size * 0.25
            center = size / 2
            draw.ellipse((center-p_r, center-p_r, center+p_r, center+p_r), fill=(20, 20, 20))
            
            # 高光
            hl_r = size * 0.1
            draw.ellipse((center+p_r*0.4, center-p_r*0.6, center+p_r*0.4+hl_r*2, center-p_r*0.6+hl_r*2), fill=(255, 255, 255, 240))
            return img

        # 生成全尺寸层级 ICO
        sizes = [256, 128, 64, 48, 32, 16]
        images = [create_img(s) for s in sizes]
        # 保存为 ico
        images[0].save('app_icon.ico', format='ICO', sizes=[(s, s) for s in sizes], append_images=images[1:])
        print('Icon generated!')
        "

    - name: Download FFmpeg (Static Build)
      shell: pwsh
      run: |
        Write-Host "Downloading FFmpeg..."
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip" -UserAgent "NativeHost"
        Write-Host "Extracting FFmpeg..."
        Expand-Archive ffmpeg.zip -DestinationPath .
        Write-Host "Moving ffmpeg.exe..."
        $ffmpegPath = Get-ChildItem -Path . -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Move-Item $ffmpegPath.FullName .\ffmpeg.exe

    - name: Build EXE
      run: |
        # 增加了 --clean 清除缓存，确保图标更新
        pyinstaller --clean --noconfirm --onefile --windowed --name "ProScreenRecorder" --icon="app_icon.ico" --add-binary "ffmpeg.exe;." --hidden-import "pyaudiowpatch" --hidden-import "pystray" --hidden-import "PIL" recorder_pro.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProScreenRecorder-EXE
        path: dist/ProScreenRecorder.exe
        compression-level: 0
