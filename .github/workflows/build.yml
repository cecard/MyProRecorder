name: Build All-in-One Recorder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5 # 这里我也顺便升级到了最新的 v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
        pip install pyinstaller

    - name: Download FFmpeg (Static Build)
      shell: pwsh
      run: |
        Write-Host "Downloading FFmpeg..."
        # 注意：这里增加了一个 UserAgent 参数，防止偶尔下载被拒绝
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip" -UserAgent "NativeHost"
        Write-Host "Extracting FFmpeg..."
        Expand-Archive ffmpeg.zip -DestinationPath .
        Write-Host "Moving ffmpeg.exe..."
        $ffmpegPath = Get-ChildItem -Path . -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Move-Item $ffmpegPath.FullName .\ffmpeg.exe

    - name: Build EXE (Bundled FFmpeg)
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "ProScreenRecorder" --add-binary "ffmpeg.exe;." recorder_pro.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4 # <--- 关键修改：这里必须是 v4
      with:
        name: ProScreenRecorder-EXE
        path: dist/ProScreenRecorder.exe
        compression-level: 0 # 不压缩，直接上传，速度更快
