name: Build All-in-One Recorder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyaudiowpatch screeninfo numpy pillow pystray pyinstaller

    - name: Download Assets (Icon & FFmpeg)
      shell: pwsh
      run: |
        Write-Host "Downloading Professional Icon..."
        # 直接下载一个包含完整尺寸层级(16-256px)的标准图标
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/microsoft/fluentui-system-icons/master/assets/Record/ic_fluent_record_48_filled.svg" -OutFile "icon.svg"
        
        # 使用 Python 将 SVG/PNG 转换为完美的 ICO
        # 这里我们下载一个 png 转换，或者直接用 PIL 生成一个绝对标准的
        python -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (256, 256), (0,0,0,0)); draw = ImageDraw.Draw(img); draw.ellipse((10,10,246,246), fill='white'); draw.ellipse((40,40,216,216), fill='#ff0000'); img.save('app_icon.ico', format='ICO', sizes=[(256,256), (128,128), (64,64), (48,48), (32,32), (16,16)])"

        Write-Host "Downloading FFmpeg..."
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip" -UserAgent "NativeHost"
        Expand-Archive ffmpeg.zip -DestinationPath .
        $ffmpegPath = Get-ChildItem -Path . -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Move-Item $ffmpegPath.FullName .\ffmpeg.exe

    - name: Build EXE
      run: |
        # --clean: 清除缓存
        # --icon: 指定图标
        # --add-data: 将图标打包进程序
        pyinstaller --clean --noconfirm --onefile --windowed --name "ProRecorder" --icon="app_icon.ico" --add-data "app_icon.ico;." --add-binary "ffmpeg.exe;." --hidden-import "pyaudiowpatch" --hidden-import "pystray" --hidden-import "PIL" recorder_pro.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProRecorder-Fixed-EXE
        path: dist/ProRecorder.exe
        compression-level: 0
