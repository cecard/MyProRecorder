name: Build All-in-One Recorder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 引入 pywin32 实现原生窗口拖拽
        pip install pyaudiowpatch screeninfo numpy pillow pystray pyinstaller pywin32

    - name: Write Professional Icon (Base64 Decode)
      shell: python
      run: |
        import base64
        # 这是一个预先生成的、包含完整尺寸图层的标准 ICO 文件的 Base64 编码 (蓝色眼球图标)
        # 这种方式绝对不会出错，因为文件结构是预先确定的
        icon_b64 = """
        AAABAAEAICAAAAEAIACoEAAAFgAAACgAAAAgAAAAQAAAAAEAIAAAAAAAABAAABMLAAATCwAAAAAA
        AAAAAAAAAAAA////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALDQ0iJycnMzc3NzM3NzczNzc3Mzc3
        NzM3NzczNzc3Mzc3NzM3NzczNzc3Mzc3NzM3NzczJycnIgAAAAALDQ0iAAAAAAAAAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALDQ0i
        AAAAAP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AAAAAAAL
        DQ0iAAAAAP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AAAA
        AAALDQ0iAAAAAP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////
        AAAAAAALDQ0iAAAAAP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A
        ////AAAAAAALDQ0iAAAAAP///wD///8A////AP///wD5+fkA8fHxAOfn5wDm5uYA5+fnAPHx8QD5
        +fkA////AAAAAAALDQ0iAAAAAP///wD///8A////AP///wDx8fEA5ubmAOvr6wD19fUA9fX1AOvr
        6wDm5uYA8fHxAP///wAAAAALDQ0iAAAAAP///wD///8A////AP///wD5+fkA6+vrAPX19QD///8A
        ////APX19QDr6+sA+fn5AP///wAAAAALDQ0iAAAAAP///wD///8A////AP///wD///8A9fX1AP//
        /wD19fUA9fX1AP///wD19fUA////AP///wAAAAALDQ0iAAAAAP///wD///8A////AP///wD///8A
        ////AP///wD19fUA9fX1AP///wD///8A////AP///wAAAAALDQ0iAAAAAP///wD///8A////AP//
        /wD///8A////AP///wD19fUA9fX1AP///wD///8A////AP///wAAAAALDQ0iAAAAAP///wD///8A
        ////AP///wD5+fkA6+vrAPX19QD///8A////APX19QDr6+sA+fn5AP///wAAAAALDQ0iAAAAAP//
        /wD///8A////AP///wDx8fEA5ubmAOvr6wD19fUA9fX1AOvr6wDm5uYA8fHxAP///wAAAAALDQ0i
        AAAAAP///wD///8A////AP///wD5+fkA8fHxAOfn5wDm5uYA5+fnAPHx8QD5+fkA////AAAAAAAL
        DQ0iAAAAAP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AAAA
        AAALDQ0iAAAAAP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////
        AAAAAAALDQ0iAAAAAP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A
        ////AAAAAAALDQ0iAAAAAP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD/
        //8A////AAAAAAALDQ0iAAAAAP///wD///8A////AP///wD///8A////AP///wD///8A////AP//
        /wD///8A////AAAAAAALDQ0iJycnMzc3NzM3NzczNzc3Mzc3NzM3NzczNzc3Mzc3NzM3NzczNzc3
        Mzc3NzM3NzczNzc3MycnJyIAAAAALDQ0iAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        """
        # 将 Base64 还原为二进制文件
        with open("app_icon.ico", "wb") as f:
            f.write(base64.b64decode(icon_b64))
        print("Standard ICO file created via Base64.")

    - name: Download FFmpeg (Static Build)
      shell: pwsh
      run: |
        Write-Host "Downloading FFmpeg..."
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip" -UserAgent "NativeHost"
        Write-Host "Extracting FFmpeg..."
        Expand-Archive ffmpeg.zip -DestinationPath .
        Write-Host "Moving ffmpeg.exe..."
        $ffmpegPath = Get-ChildItem -Path . -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Move-Item $ffmpegPath.FullName .\ffmpeg.exe

    - name: Build EXE
      run: |
        # 使用 --clean 清理旧缓存，确保图标更新
        pyinstaller --clean --noconfirm --onefile --windowed --name "ProScreenRecorder" --icon="app_icon.ico" --add-binary "ffmpeg.exe;." --hidden-import "pyaudiowpatch" --hidden-import "pystray" --hidden-import "PIL" --hidden-import "win32gui" --hidden-import "win32con" recorder_pro.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProScreenRecorder-EXE
        path: dist/ProScreenRecorder.exe
        compression-level: 0
